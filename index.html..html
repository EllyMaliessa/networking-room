<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMS613 - Networking Room</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #101827;
}

#scene {
  position: fixed;
  inset: 0;
}

#panel {
  position: fixed;
  top: 18px;
  left: 18px;
  z-index: 5;
  background: rgba(15,23,42,.94);
  color: white;
  padding: 18px;
  border-radius: 12px;
  width: 300px;
}

#panel h2 { margin: 0 0 8px; }

#panel p {
  font-size: 12px;
  line-height: 1.5;
  color: #cbd5e1;
}

#controls {
  position: fixed;
  right: 18px;
  top: 18px;
  z-index: 5;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

button {
  background: #172b48;
  color: white;
  border: 1px solid #64748b;
  padding: 10px 14px;
  border-radius: 8px;
  cursor: pointer;
}

button:hover { background: #2563eb; }

#info {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  width: min(550px, 90%);
  background: rgba(15,23,42,.95);
  color: white;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
  font-size: 13px;
  line-height: 1.5;
  z-index: 5;
}

.tag {
  color: white;
  background: #172b48;
  border: 1px solid #93c5fd;
  border-radius: 5px;
  padding: 4px 7px;
  font-size: 11px;
  font-weight: bold;
  white-space: nowrap;
  pointer-events: none;
}

@media(max-width:600px) {
  #panel { width: 230px; top: 8px; left: 8px; padding: 12px; }
  #controls { top: auto; bottom: 100px; right: 8px; }
}
</style>
</head>

<body>

<div id="scene"></div>

<div id="panel">
  <h2>NETWORKING ROOM</h2>
  <p>IMS613 Individual Assignment</p>
  <p>Drag to rotate the room.<br>
  Scroll to zoom in and out.<br>
  Click equipment for information.</p>
  <p>3D Data Center Networking Room Design</p>
</div>

<div id="controls">
  <button id="overview">Overview</button>
  <button id="front">Front View</button>
  <button id="rotate">360° Tour</button>
  <button id="labels">Hide Labels</button>
</div>

<div id="info">
  <strong>Welcome to the Networking Room</strong><br>
  Click any equipment to learn about its function.
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import {
  CSS2DRenderer,
  CSS2DObject
} from 'three/addons/renderers/CSS2DRenderer.js';

// SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9db1c5);

const camera = new THREE.PerspectiveCamera(
  50, window.innerWidth / window.innerHeight, 0.1, 100
);

camera.position.set(13, 10, 16);

// RENDERER
const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.getElementById('scene').appendChild(renderer.domElement);

// LABEL RENDERER
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.pointerEvents = 'none';

document.getElementById('scene').appendChild(labelRenderer.domElement);

// ORBIT CONTROL
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2;
controls.minDistance = 7;
controls.maxDistance = 30;

// LIGHTING
scene.add(new THREE.HemisphereLight(0xffffff, 0x64748b, 2));

const light = new THREE.DirectionalLight(0xffffff, 2.5);
light.position.set(-7, 14, 9);
light.castShadow = true;
scene.add(light);

// MATERIALS
const materials = {
  wall: new THREE.MeshStandardMaterial({color: 0xdce5ed}),
  floor: new THREE.MeshStandardMaterial({color: 0x64748b}),
  dark: new THREE.MeshStandardMaterial({color: 0x172033}),
  rack: new THREE.MeshStandardMaterial({color: 0x263449, metalness: 0.5}),
  blue: new THREE.MeshStandardMaterial({color: 0x2563eb}),
  green: new THREE.MeshStandardMaterial({color: 0x15803d}),
  red: new THREE.MeshStandardMaterial({color: 0xb91c1c}),
  amber: new THREE.MeshStandardMaterial({color: 0xf59e0b}),
  white: new THREE.MeshStandardMaterial({color: 0xf8fafc}),
  glass: new THREE.MeshStandardMaterial({
    color: 0x93c5fd,
    transparent: true,
    opacity: 0.25
  })
};

const room = new THREE.Group();
scene.add(room);

const clickableObjects = [];

function createBox(name, x, y, z, w, h, d, material, description = '') {

  const geometry = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(geometry, material);

  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.name = name;
  mesh.userData.description = description;

  room.add(mesh);

  if (description) clickableObjects.push(mesh);

  return mesh;
}

function createLabel(text, x, y, z) {

  const element = document.createElement('div');
  element.className = 'tag';
  element.textContent = text;

  const label = new CSS2DObject(element);
  label.position.set(x, y, z);

  room.add(label);

  return label;
}

// ROOM STRUCTURE

createBox('Floor', 0, -0.2, 0, 14, 0.4, 10, materials.floor);

createBox('Back Wall', 0, 3.2, -5, 14, 6.4, 0.25, materials.wall);

createBox('Left Wall', -7, 3.2, 0, 0.25, 6.4, 10, materials.wall);

createBox('Right Wall', 7, 3.2, 0, 0.25, 6.4, 10, materials.wall);

createBox('Ceiling', 0, 6.5, 0, 14, 0.2, 10, materials.white);

// FLOOR TILES

for (let x = -6; x <= 6; x += 1.5) {
  for (let z = -4; z <= 4; z += 1.5) {
    createBox(
      'Raised Floor Tile',
      x, 0.015, z,
      1.45, 0.02, 1.45,
      new THREE.MeshStandardMaterial({color: 0x94a3b8})
    );
  }
}

// CEILING LIGHTS

for (let x = -4; x <= 4; x += 4) {
  createBox(
    'LED Ceiling Light',
    x, 6.35, 0,
    1.5, 0.08, 0.3,
    materials.white
  );
}

// CABLE TRAYS

createBox(
  'Cable Tray',
  0, 5.7, -2.5,
  11, 0.15, 0.3,
  materials.dark,
  'Cable trays organize network cables above the equipment racks.'
);

// NETWORK RACKS

function createRack(x, z, number) {

  const group = new THREE.Group();
  group.position.set(x, 0, z);
  room.add(group);

  function rackBox(name, x, y, z, w, h, d, mat, desc = '') {
    const obj = createBox(name, x, y, z, w, h, d, mat, desc);
    group.remove(obj);
    group.add(obj);
    return obj;
  }

  rackBox(
    'Network Rack',
    0, 2.15, 0,
    1.5, 4.3, 1.2,
    materials.rack,
    'Network rack securely houses network devices and equipment.'
  );

  rackBox(
    'Glass Rack Door',
    0, 2.15, 0.62,
    1.4, 4.1, 0.04,
    materials.glass,
    'Glass door allows visual inspection of equipment while restricting access.'
  );

  const devices = [
    {
      y: 3.7,
      name: 'Patch Panel',
      mat: materials.blue,
      desc: 'Patch panel organizes Ethernet cable connections between network devices.'
    },
    {
      y: 3.15,
      name: 'Core Switch',
      mat: materials.green,
      desc: 'Core switch connects network segments and forwards data at high speed.'
    },
    {
      y: 2.6,
      name: 'Access Switch',
      mat: materials.green,
      desc: 'Access switch connects computers, printers and wireless access points.'
    },
    {
      y: 2.05,
      name: 'Router',
      mat: materials.blue,
      desc: 'Router forwards data packets between different networks.'
    },
    {
      y: 1.5,
      name: 'Firewall',
      mat: materials.red,
      desc: 'Firewall monitors and filters network traffic to protect the network.'
    },
    {
      y: 0.95,
      name: 'Fiber Optic Panel',
      mat: materials.blue,
      desc: 'Fiber optic panel manages fiber connections for high-speed communication.'
    }
  ];

  devices.forEach(device => {

    rackBox(
      device.name,
      0, device.y, 0.68,
      1.25, 0.28, 0.12,
      device.mat,
      device.desc
    );

    for (let i = 0; i < 6; i++) {
      rackBox(
        'Network Port',
        -0.48 + i * 0.19,
        device.y,
        0.76,
        0.06, 0.06, 0.02,
        new THREE.MeshStandardMaterial({
          color: 0x22c55e,
          emissive: 0x14532d
        })
      );
    }
  });

  const label = createLabel(
    'NETWORK RACK ' + number,
    x, 4.5, z + 0.8
  );

  label.position.set(x, 4.6, z + 0.8);
}

createRack(-3.6, -1.8, 1);
createRack(0, -1.8, 2);
createRack(3.6, -1.8, 3);

// UPS

createBox(
  'UPS Cabinet',
  5.4, 1.2, -3.7,
  1.3, 2.4, 1,
  materials.amber,
  'UPS provides backup power during electricity interruptions.'
);

createLabel('UPS BACKUP', 5.4, 2.6, -3);

// PDU

createBox(
  'Power Distribution Unit',
  5.3, 3.2, -2.8,
  0.7, 1.8, 0.4,
  materials.dark,
  'PDU distributes electrical power to network equipment.'
);

createLabel('PDU', 5.3, 4.2, -2.5);

// COOLING UNIT

createBox(
  'Precision Cooling Unit',
  -5.4, 1.5, -3.8,
  1.5, 3, 1.1,
  materials.white,
  'Cooling unit controls room temperature and removes heat produced by network equipment.'
);

createLabel('COOLING UNIT', -5.4, 3.2, -3);

// COOLING VENTS

for (let i = 0; i < 5; i++) {
  createBox(
    'Cooling Vent',
    -5.4, 0.5 + i * 0.4, -3.2,
    1, 0.08, 0.03,
    materials.blue
  );
}

// ACCESS CONTROL

createBox(
  'Access Control',
  6.8, 1.5, 3.2,
  0.15, 0.5, 0.2,
  materials.red,
  'Access control system restricts room entry to authorized personnel.'
);

createLabel('ACCESS CONTROL', 6.2, 2.1, 3.2);

// CCTV

createBox(
  'CCTV Camera',
  5.8, 5.7, 4.4,
  0.4, 0.25, 0.4,
  materials.dark,
  'CCTV monitors room activities for physical security.'
);

createLabel('CCTV CAMERA', 5.8, 6, 4.4);

// FIRE SUPPRESSION

createBox(
  'Fire Suppression Cylinder',
  -5.5, 1.1, 3.6,
  0.55, 2.1, 0.55,
  materials.red,
  'Fire suppression system protects network equipment against fire.'
);

createLabel('FIRE SUPPRESSION', -5.5, 2.3, 4);

// TECHNICIAN WORKSTATION

createBox(
  'Maintenance Desk',
  -4.8, 0.7, 1.2,
  2.7, 0.2, 1.1,
  materials.dark,
  'Technicians use this workstation for network maintenance and troubleshooting.'
);

createBox(
  'Monitoring Monitor',
  -4.8, 1.6, 0.7,
  1.5, 1, 0.15,
  materials.blue,
  'Monitoring workstation displays network status, device alerts and network performance.'
);

createLabel('TECHNICIAN WORKSTATION', -4.8, 2.3, 0.7);

// LIGHTS

const pointLight = new THREE.PointLight(0x93c5fd, 60, 25);
pointLight.position.set(0, 5, 2);
scene.add(pointLight);

// INTERACTION

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

renderer.domElement.addEventListener('click', function(event) {

  const rect = renderer.domElement.getBoundingClientRect();

  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const hits = raycaster.intersectObjects(clickableObjects);

  if (hits.length > 0) {

    const object = hits[0].object;

    document.getElementById('info').innerHTML =
      '<strong>' + object.name + '</strong><br>' +
      object.userData.description;
  }

});

// BUTTONS

document.getElementById('overview').onclick = function() {
  camera.position.set(13, 10, 16);
  controls.target.set(0, 2, 0);
  controls.update();
};

document.getElementById('front').onclick = function() {
  camera.position.set(0, 5, 19);
  controls.target.set(0, 2, 0);
  controls.update();
};

let rotating = false;

document.getElementById('rotate').onclick = function() {
  rotating = !rotating;
  this.textContent = rotating ? 'Stop Rotation' : '360° Tour';
};

let labelsVisible = true;

document.getElementById('labels').onclick = function() {
  labelsVisible = !labelsVisible;
  labelRenderer.domElement.style.display =
    labelsVisible ? 'block' : 'none';

  this.textContent = labelsVisible ? 'Hide Labels' : 'Show Labels';
};

// RESPONSIVE

window.addEventListener('resize', function() {

  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);

});

// ANIMATION

function animate() {

  requestAnimationFrame(animate);

  if (rotating) {
    const offset = camera.position.clone().sub(controls.target);
    offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), 0.003);
    camera.position.copy(controls.target).add(offset);
  }

  controls.update();

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

animate();

</script>
</body>
</html>
